name: Build Android APK

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Capacitor CLI requires Node >= 22

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate and Commit Persistent Keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "Keystore not found. Generating a new persistent debug keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:" > android/app/SHA1_FINGERPRINT.txt
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/debug.keystore android/app/SHA1_FINGERPRINT.txt
            git commit -m "chore: auto-generate persistent debug keystore for firebase auth [skip ci]"
            git push
          fi

      - name: Setup Keystore for Build
        run: |
          mkdir -p ~/.android
          cp android/app/debug.keystore ~/.android/debug.keystore

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor for Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMessenger-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
