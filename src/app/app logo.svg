<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- চোখের জন্য আরামদায়ক ডার্ক স্লেট ব্যাকগ্রাউন্ড -->
    <linearGradient id="slate-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- প্রফেশনাল প্রাইমারি ব্লু গ্রাডিয়েন্ট (বাম বাবল) -->
    <linearGradient id="formal-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- শান্ত সেকেন্ডারি ব্লু-গ্রে গ্রাডিয়েন্ট (ডান বাবল) -->
    <linearGradient id="formal-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>



  <!-- মেইন আইকন গ্রাফিক্স -->
  <g transform="translate(106, 106)">
    <!-- প্রথম চ্যাট বাবল (বাম ও প্রধান) -->
    <path d="M40,110 C40,49.2 89.2,0 150,0 C210.8,0 260,49.2 260,110 C260,135.2 251.6,158.4 237.4,177.2 L258.1,218.6 C260.6,223.6 255.4,229.2 250.1,227.1 L198.8,206.8 C183.8,215.2 167.5,220 150,220 C89.2,220 40,170.8 40,110 Z" 
          fill="url(#formal-blue)" />

    <!-- দ্বিতীয় চ্যাট বাবল (ডান ও পেছনে - যা ওভারল্যাপ করে সুন্দর গভীরতা তৈরি করে) -->
    <path d="M170,140 C170,181.4 203.6,215 245,215 C256.9,215 268,197.8 278.2,204.8 L313.1,218.6 C316.7,220 320.2,216.2 318.8,212.8 L304.7,184.6 C314.4,171.8 320,156.6 320,140 C320,98.6 286.4,65 245,65 C203.6,65 170,98.6 170,140 Z" 
          fill="url(#formal-slate)" opacity="0.85" />
    
    <!-- ভেতরের ৩টি মিনিমাল ডট (মেসেঞ্জার সিগন্যাল) -->
    <circle cx="110" cy="110" r="10" fill="#FFFFFF" opacity="0.9" />
    <circle cx="150" cy="110" r="10" fill="#FFFFFF" opacity="0.9" />
    <circle cx="190" cy="110" r="10" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
